<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <!-- Khoá tỉ lệ: không cho phóng to bằng 2 ngón / chạm đúp -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f7" />
    <!-- Đặt sáng/tối TRƯỚC khi vẽ trang để không nháy nền (khoá lưu trữ: lexuan-theme, mặc định sáng) -->
    <script>
      (function () {
        var t = 'light';
        try { var s = localStorage.getItem('lexuan-theme'); if (s === 'dark' || s === 'light') t = s; } catch (e) {}
        var r = document.documentElement; r.dataset.theme = t; r.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'dark' ? '#09090b' : '#f3f5f7';
      })();
    </script>
    <meta name="description" content="Hãng đá Lệ Xuân – quản lý bán hàng, công nợ, nhân viên và báo cáo" />
    <title>Hãng đá Lệ Xuân</title>
    <link rel="icon" href="/assets/favicon-v2.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/icons/favicon-32-v2.png" sizes="32x32" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v2.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lệ Xuân" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Mở sẵn kết nối tới máy chủ dữ liệu trong lúc tải app (đỡ ~0,1–0,3 giây trên điện thoại) -->
    <link rel="preconnect" href="__SUPABASE_ORIGIN__" crossorigin />
    <link rel="modulepreload" href="/assets/app.js?v=__BUILD_VERSION__" />
    <link rel="stylesheet" href="/assets/app.css?v=__BUILD_VERSION__" />
  </head>
  <body>
    <div id="app">
      <div class="grid min-h-dvh place-items-center text-subtle">Đang tải…</div>
    </div>
    <noscript>Vui lòng bật JavaScript để dùng ứng dụng.</noscript>
    <script type="module" src="/assets/app.js?v=__BUILD_VERSION__"></script>
  </body>
</html>
